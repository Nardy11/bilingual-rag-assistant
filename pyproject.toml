[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-rag-assistant"
version = "1.0.0"
description = "Arabic/English retrieval-augmented QA with hybrid search (FAISS + BM25), re-ranking and citations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nardy Michelle" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "sentencepiece>=0.2"]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4"]

[tool.setuptools]
packages = ["rag"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
