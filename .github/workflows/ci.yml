name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # tests use a download-free hashing embedder: no model weights, no torch, no API keys
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
